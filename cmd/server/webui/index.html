<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CLIP STUDIO PAINT — Remote</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🎨</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">🎨</span>
      <div>
        <h1>CLIP STUDIO PAINT Remote</h1>
        <p class="sub">companion-mode controller</p>
      </div>
    </div>
    <div class="status" id="status">
      <span class="pill" id="status-pill"><span class="dot"></span><span id="status-text">connecting…</span></span>
      <dl class="status-meta">
        <div><dt>host</dt><dd id="status-addr">—</dd></div>
        <div><dt>spec</dt><dd id="status-spec">—</dd></div>
        <div><dt>quick&nbsp;access</dt><dd id="status-qa">—</dd></div>
      </dl>
    </div>
  </header>

  <div class="layout">
    <nav class="sidenav" id="sidenav" aria-label="Sections"></nav>

    <main id="main">
      <!-- Sections are generated by app.js -->
    </main>

    <aside class="activity" id="activity">
      <div class="activity-head">
        <h2>Activity</h2>
        <div class="activity-actions">
          <label class="chk"><input type="checkbox" id="activity-autoscroll" checked /> autoscroll</label>
          <button class="btn ghost sm" id="activity-clear">clear</button>
        </div>
      </div>
      <ol class="log" id="log"></ol>
    </aside>
  </div>

  <button class="activity-toggle" id="activity-toggle" title="Toggle activity panel">☰ log</button>

  <script src="app.js"></script>
</body>
</html>
